<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main>
      <div class="login_homebutton_logo">
        <a href="/">
          <img
            src="images/login_page/pandaMarketLogo.png"
            alt="판다마켓 홈"
            width="396"
            height="132"
          />
        </a>
      </div>

      <form method="post">
        <div class="input_item">
          <label for="email">이메일</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="이메일을 입력해 주세요"
          />
        </div>
        <div class="input_item">
          <label for="nickname">닉네임</label>
          <input
            id="nickname"
            name="nickname"
            type="nickname"
            placeholder="닉네임을 입력해 주세요"
          />
        </div>

        <div class="input_item">
          <label for="password">비밀번호</label>
          <div class="input_with_icon">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해 주세요"
            />
            <img
              src="images/login_page/btn_visibility_on_24px.png"
              alt="비밀번호 숨김 상태 아이콘"
              class="btn_visibility"
            />
          </div>
        </div>
        <div class="input_item">
          <label for="password">비밀번호 확인</label>
          <div class="input_with_icon">
            <input
              id="password"
              name="password"
              type="passwordconfirm"
              placeholder="비밀번호를 입력해 주세요"
            />
            <img
              src="images/signup_page/btn_visibility_on_24px.png"
              alt="비밀번호 숨김 상태 아이콘"
              class="btn_visibility"
            />
          </div>
        </div>
      </form>
      <button type="submit" class="button pill-button">회원가입</button>

      <div class="social_login">
        <h3>간편 로그인하기</h3>
        <div class="social-login-buttons-container">
          <a
            href="https://www.google.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="구글 로그인"
            ><img
              src="images/signup_page/googleLogo.png"
              alt="구글 로그인"
              width="42"
          /></a>
          <a
            href="https://www.kakaocorp.com/page/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="카톡 로그인 "
            ><img
              src="images/signup_page/kakaoLogo.png"
              alt="카톡 로그인 "
              width="42"
          /></a>
        </div>
      </div>
      <div class="swith_to_otherpage">
        이미 회원이신가요? <a href="login.html">로그인</a>
      </div>
    </main>
  </body>
</html>
