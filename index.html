<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" href="/images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/home.css" />
  </head>
  <body>
    <!-- header -->
    <header>
      <a href="/"
        ><img
          class="logo"
          src="/images/logo/pandaMarket-Logo-mobile.png"
          alt="판다마켓 로고"
      /></a>
      <a id="linkToLogin" class="button" href="login.html">로그인</a>
    </header>

    <!-- main -->
    <main>
      <section id="banner-top" class="banner">
        <div class="container">
          <div class="banner-title">
            <span>일상의 모든 물건을</span>
            <span>거래해 보세요</span>
          </div>
          <a href="item.html" class="button btn-round">구경하러 가기</a>
        </div>
      </section>

      <section id="contents" class="container">
        <div class="content">
          <img
            class="content-img"
            src="/images/home/Img_content_01.png"
            alt="인기 상품"
          />
          <div class="content-description">
            <div class="content-tag">Hot Item</div>
            <div class="content-title">
              <span>인기 상품을</span>
              <span>확인해보세요</span>
            </div>
            <p>
              가장 HOT한 중고거래 물품을 <br />
              판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
        <div class="content reverse">
          <img
            class="content-img"
            src="/images/home/Img_content_02.png"
            alt="상품 검색"
          />
          <div class="content-description">
            <div class="content-tag">Search</div>
            <div class="content-title">
              <span>구매를 원하는</span>
              <span>상품을 검색하세요</span>
            </div>
            <p>
              구매하고 싶은 물품은 검색해서 <br />
              쉽게 찾아보세요
            </p>
          </div>
        </div>
        <div class="content">
          <img
            class="content-img"
            src="/images/home/Img_content_03.png"
            alt="상품 등록"
          />
          <div class="content-description">
            <div class="content-tag">Register</div>
            <div class="content-title">
              <span>판매를 원하는</span>
              <span>상품을 등록하세요</span>
            </div>
            <p>
              어떤 물건이든 판매하고 싶은 상품을 <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section id="banner-bottom" class="banner">
        <div class="container">
          <div class="banner-title">
            <span>믿을 수 있는</span>
            <span>판다마켓 중고거래</span>
          </div>
        </div>
      </section>
    </main>

    <!-- footer -->
    <footer>
      <div class="copyright">@codeit - 2025</div>
      <div class="footer-menu">
        <a href="privacy.html">Privacy Policy</a>
        <a href="faq.html">FAQ</a>
      </div>
      <div class="footer-social">
        <a
          href="https://www.facebook.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img src="/images/icon/sns/facebook.svg" alt="facebook"
        /></a>
        <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer"
          ><img src="/images/icon/sns/twitter.svg" alt="twitter"
        /></a>
        <a
          href="https://www.youtube.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img src="/images/icon/sns/youtube.svg" alt="youtube"
        /></a>
        <a
          href="https://www.instagram.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img src="/images/icon/sns/instagram.svg" alt="instagram"
        /></a>
      </div>
    </footer>
  </body>
</html>
