<!DOCTYPE html>

    <header>
        <nav>

            <div class="top">

        </section>

         <section class="best-section">
            <div class="feature">

                />

        </section>

        </section>

            <div class="feature">

                <p class="feature-tag">Register</p>

                    판매를 원하는 <br />

                </h1>

                    어떤 물건이든 판매하고 싶은 상품을 <br />

        <section class="belive-section">
            <div class="bottom">
                <h1>
                    믿을 수 있는 <br />
