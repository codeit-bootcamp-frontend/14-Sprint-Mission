<!DOCTYPE html>
<html lang="kr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>판다마켓</title>
    <link rel="icon" href="./styles/assets/icons/icon/panda.svg" />
      <!-- reset, normalize 파일 먼저 -->
    <link rel="stylesheet" href="./styles/reset.css" />
    <link rel="stylesheet" href="./styles/normalize.css" />
    <link rel="stylesheet" href="./styles/style.css" />

    <!-- components 폴더의 CSS들(순서는 사용 상황/우선순위에 맞게) -->
    <link rel="stylesheet" href="./styles/components/Home.css" />
    <link rel="stylesheet" href="./styles/components/buttons.css" />
    <link rel="stylesheet" href="./styles/components/footer.css" />
    <link rel="stylesheet" href="./styles/components/gnb.css" />
    <link rel="stylesheet" href="./styles/components/input.css" />

    <!-- 마지막으로 전체 스타일 -->
    <link rel="stylesheet" href="./styles/style.css" />
</head>
<body>
    <div>
        <header class="gnb-wrapper">
          <div class="gnb">
            <a class="logo" href="/">
                <img src="styles/assets/icons/icon/panda.svg"/>
                <span>판다마켓</span>
            </a>
            <a class="btn-small-48" href="/login">로그인</a>
          </div>
        </header>
        
        <main>
            <section class="home-wrapper">
                <div class="landing-text">
                  <h1>일상의 모든 물건을 거래해 보세요</h1>
                  <a class="btn-large" href="/items">구경하러가기</a>
                </div>
                <div><img src="/styles/assets/images/Home/Img_home_top.svg"/></div>
            </section>
            <section class="section-home-container">
              <div class="section-home-wrapper">
                <img src="/styles/assets/images/Home/Img_home_01.png"/>
                <div class="section-home-text">
                  <span>Hot item</span>
                  <h1>인기 상품을 확인해 보세요</h1>
                  <p>
                    가장 HOT한 중고거래 물품을
                    판다 마켓에서 확인해 보세요
                  </p>
                </div>
              </div>
              <div class="section-home-wrapper reverse">
                <img src="/styles/assets/images/Home/Img_home_02.png"/>
                <div class="section-home-text">
                  <span>Search</span>
                  <h1>구매를 원하는
                    상품을 검색하세요</h1>
                  <p>
                    구매하고 싶은 물품은 검색해서
                    쉽게 찾아보세요
                  </p>
                </div>
              </div>
              <div class="section-home-wrapper">
                <img src="/styles/assets/images/Home/Img_home_03.png"/>
                <div class="section-home-text">
                  <span>Register</span>
                  <h1>판매를 원하는 상품을 등록하세요</h1>
                  <p>
                    어떤 물건이든 판매하고 싶은 상품을
                    쉽게 등록하세요
                  </p>
                </div>
              </div>
            </section>
            <section class="home-wrapper">
              <div class="landing-text">
                <h1>믿을 수 있는 <br/> 판다마켓 중고거래</h1>
              </div>
              <img src="/styles/assets/images/Home/Img_home_bottom.svg"/>
            </section>

        </main>
    
        <footer>
            <div class="footer-wrapper">
              <span class="footer-info">
                  @codeit-2025
              </span>
              <div class="footer-links">
                <a href="/privacy">Privacy Policy</a>
                <a href="/faq">FAQ</a>
              </div>
              <div class="sns-links">
                  <a href="https://www.facebook.com" target="_blank">
                    <img src="/styles/assets/icons/sns/ic_facebook.svg"/>
                  </a>
                  <a href="https://twitter.com" target="_blank">
                    <img src="/styles/assets/icons/sns/ic_twitter.svg"/>
                  </a>
                  <a href="https://youtube.com" target="_blank">
                    <img src="/styles/assets/icons/sns/ic_youtube.svg"/>
                  </a>
                  <a href="https://instagram.com" target="_blank">
                    <img src="/styles/assets/icons/sns/ic_instagram.svg"/>
                  </a>
              </div>
            </div>
        </footer>
      </div>
</body>
</html>
