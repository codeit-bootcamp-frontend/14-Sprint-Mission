<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>판다마켓</title>
</head>
<body>
    <header>
        <nav>
            <a href="/">
                <img src="assets/panda-logo.png" alt="판다마켓 로고">
            </a>
            <a class="login" href="login.html">로그인</a>
        </nav>
    </header>
     
    <main>
        <section class="see-section">
            <div class="top">
                <h1>
                    일상의 모든 물건을 <br>
                    거래해 보세요
                </h1>
                <a href="items.html">구경하러 가기</a>
                <img src="assets/panda.png" alt="판다 이미지">
            </div>
        </section>

         <section class="best-section">
            <div class="feature">
                <img src="assets/best.png" alt="상품 이미지"
                /> 
                <div class="feature-content">
                    <p class="feature-tag">Hot Item</p>
                <h1>
                    인기 상품을 <br />
                    확인해 보세요
                </h1>
                <p class="feature-description">
                    가장 HOT한 중고거래 물품을 <br />
                    판다 마켓에서 확인해 보세요
                </p>
                </div>
            </div>
            
            <div class="feature">
             <div class="feature-content">
                <p class="feature-tag">Search</p>
                <h1>
                    구매를 원하는 <br />
                    상품을 검색하세요
                </h1>
                <p class="feature-description">
                    구매하고 싶은 물품은 검색해서 <br />
                    쉽게 찾아보세요
                </p>
             </div>
                <img src="assets/search.png" alt="검색 이미지"
                />
            </div>
            
            <div class="feature">
             <img src="assets/sell.png" alt="판매 이미지"
             />
             <div class="feature-content">
                <p class="feature-tag">Register</p>
                <h1>
                    판매를 원하는 <br />
                    상품을 등록하세요
                </h1>
                 <p class="feature-description">
                    어떤 물건이든 판매하고 싶은 상품을 <br />
                    쉽게 등록하세요
                 </p>
            </div>
              
        </section>
    </main>
</body>
</html>
