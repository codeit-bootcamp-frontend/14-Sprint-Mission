<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css"
    />
    <title>판다마켓</title>

    <meta name="description" content="일상의 모든 물건을 거래해보세요" />
    <!-- 페이스북, 카카오톡 -->
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://vocal-concha-a066c0.netlify.app/"
    />
    <meta
      property="og:image"
      content="https://vocal-concha-a066c0.netlify.app//images/img_preview.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="판다 마켓" />
    <meta
      name="twitter:description"
      content="일상의 모든 물건을 거래해보세요"
    />
    <meta
      property="og:image"
      content="https://vocal-concha-a066c0.netlify.app//images/img_preview.png"
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="header" class="header">
      <div class="main_inner">
        <h1 class="logo">
          <a href="/"><img src="images/logo.png" alt="판다마켓" /></a>
        </h1>
        <a href="login.html" class="btn-blue">로그인</a>
      </div>
    </header>

    <main id="contents" class="contents">
      <section id="section_top" class="section section_top">
        <div class="main_inner">
          <div class="text_box">
            <h2 class="main_text">
              일상의 모든 물건을 <br class="pc_only mobile_only" />거래해 보세요
            </h2>
            <a href="/items" class="btn-blue large">구경하러 가기</a>
          </div>
        </div>
      </section>
      <section id="section2" class="section section2">
        <div class="main_inner">
          <div class="center_box">
            <img src="images/img_home_01.png" alt="" />
            <div class="text_box">
              <span class="tag_text">Hot item</span>
              <h2 class="main_text">
                인기 상품을 <br class="pc_only" />확인해 보세요
              </h2>
              <p class="desc_text">
                가장 HOT한 중고거래 물품을 <br />판다 마켓에서 확인해 보세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section id="section3" class="section section3">
        <div class="main_inner">
          <div class="center_box">
            <div class="text_box">
              <span class="tag_text">Search</span>
              <h2 class="main_text">
                구매를 원하는 <br class="pc_only" />상품을 검색하세요
              </h2>
              <p class="desc_text">
                구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
              </p>
            </div>
            <img src="images/img_home_02.png" alt="" />
          </div>
        </div>
      </section>
      <section id="section4" class="section section4">
        <div class="main_inner">
          <div class="center_box">
            <img src="images/img_home_03.png" alt="" />
            <div class="text_box">
              <span class="tag_text">Register</span>
              <h2 class="main_text">
                판매를 원하는 <br class="pc_only" />상품을 등록하세요
              </h2>
              <p class="desc_text">
                어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
              </p>
            </div>
          </div>
        </div>
      </section>
      <section id="section_bottom" class="section section_bottom">
        <div class="main_inner">
          <div class="text_box">
            <h2 class="main_text">믿을 수 있는<br />판다마켓 중고 거래</h2>
          </div>
        </div>
      </section>
    </main>
    <footer id="footer" class="footer">
      <div class="main_inner">
        <span class="copyright">©codeit - 2024</span>
        <div class="menus">
          <a href="/privacy">Privacy Policy</a>
          <a href="/faq">FAQ</a>
        </div>
        <div class="sns">
          <a
            href="https://www.facebook.com/?locale=ko_KR"
            target="_blank"
            rel="noopener noreferrer"
            ><img src="images/ico_facebook.png" alt="페이스북"
          /></a>
          <a
            href="https://x.com/?lang=ko"
            target="_blank"
            rel="noopener noreferrer"
            ><img src="images/ico_twitter.png" alt="트위터"
          /></a>
          <a
            href="https://www.youtube.com/?hl=ko&gl=KR&app=desktop"
            target="_blank"
            rel="noopener noreferrer"
            ><img src="images/ico_youtube.png" alt="유튜브"
          /></a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
            ><img src="images/ico_insta.png" alt="인스타그램"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
