<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/color.css" />
    <link rel="stylesheet" href="styles/typography.css" />
    <link rel="stylesheet" href="./styles/components/button.css" />
    <link rel="stylesheet" href="styles/auth.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="auth-container">
      <div class="auth-container__logo">
        <a href="/"
          ><img
            src="images/logo/panda-market.png"
            alt="판다마켓 홈"
            class="auth-logo-img"
        /></a>
      </div>
      <form id="loginForm" class="login-form">
        <div class="login-form__item">
          <label for="email">이메일</label>
          <input
            id="email"
            name="email"
            type="email"
            placeholder="이메일을 입력해주세요."
          />
          <span id="emailEmptyError" class="error-message"
            >이메일을 입력해 주세요</span
          >
          <span id="emailInvalidError" class="error-message"
            >잘못된 이메일 형식입니다</span
          >
        </div>
        <div class="login-form__item">
          <label for="password">비밀번호</label>
          <div class="input-wrapper">
            <input
              id="password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해주세요."
            />
            <button type="button" class="password-toggle-btn">
              <img
                src="./images/icon/eye_invisible.png"
                alt="비밀번호 숨김 아이콘"
                class="password-toggle-icon"
                width="24px"
              />
            </button>
          </div>
          <span id="passwordEmptyError" class="error-message"
            >비밀번호를 입력해 주세요</span
          >
          <span id="passwordInvalidError" class="error-message"
            >비밀번호를 8자 이상 입력해 주세요</span
          >
        </div>
        <button type="submit" class="auth-btn btn-large btn-primary text-xl">
          로그인
        </button>
      </form>
      <div class="social-login-container">
        <div class="text-lg">간편 로그인하기</div>
        <div class="social-login-container__btns">
          <a href="https://www.google.com/" target="_blank"
            ><img
              src="./images/social/google.png"
              alt="구글 로그인"
              width="42px" /></a
          ><a href="https://www.kakaocorp.com/page/" target="_blank"
            ><img
              src="./images/social/kakao.png"
              alt="카카오톡 로그인"
              width="42px"
          /></a>
        </div>
      </div>
      <div class="auth-switch text-md">
        <span>판다마켓이 처음이신가요?</span><a href="signup.html">회원가입</a>
      </div>
    </div>
    <script src="./scripts/auth.js"></script>
  </body>
</html>
