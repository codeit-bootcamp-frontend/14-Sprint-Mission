<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/styles.css" />
  </head>

  <body>
    <header class="header">
      <div class="header__container">
        <a href="/" class="header__link"
          ><img
            src="images/logo/panda-market-logo.png"
            alt="판다마켓 로고"
            width="40"
            class="header__img" /><img
            src="images/logo/panda-market-title.png"
            alt="판다마켓 로고 타이틀"
            width="103"
        /></a>
        <a href="signin.html" class="btn btn-small btn-primary loginLinkButton"
          >로그인</a
        >
      </div>
    </header>

    <main>
      <section id="banner-top" class="banner">
        <div class="wrapper">
          <div class="banner__contents">
            <div class="banner__title">
              <h1>
                <span>일상의 모든 물건을</span>
                <span class="banner-top__title__span">거래해 보세요</span>
              </h1>
              <a href="items.html" class="btn btn-primary" id="banner__btn"
                >구경하러 가기</a
              >
            </div>
          </div>
        </div>
      </section>

      <section class="wrapper section-wrapper">
        <div class="section-item">
          <div class="section-img-wrapper">
            <img src="images/home/Img_home_01.png" alt="인기 상품" />
          </div>
          <div class="section-content">
            <div class="section-title">
              <span class="section-tag">Hot item</span>
              <div>
                <span>인기 상품을</span>
                <span class="section-title__span">확인해보세요</span>
              </div>
            </div>
            <p class="section-des">
              가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요
            </p>
          </div>
        </div>
        <div class="section-item">
          <div class="section-content">
            <div class="section-title">
              <span class="section-tag">Search</span>
              <div>
                <span>구매를 원하는</span
                ><span class="section-title__span">상품을 검색하세요</span>
              </div>
            </div>
            <p class="section-des">
              구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
            </p>
          </div>
          <div class="section-img-wrapper">
            <img src="images/home/Img_home_02.png" />
          </div>
        </div>
        <div class="section-item">
          <div class="section-img-wrapper">
            <img src="images/home/Img_home_03.png" alt="판매 상품 등록" />
          </div>
          <div class="section-content">
            <div class="section-title">
              <span class="section-tag">Register</span>
              <div>
                <span>판매를 원하는</span>
                <span class="section-title__span">상품을 등록하세요</span>
              </div>
            </div>
            <p class="section-des">
              어떤 물건이든 판매하고 싶은 상품을
              <br />
              쉽게 등록하세요
            </p>
          </div>
        </div>
      </section>

      <section id="banner-bottom" class="banner">
        <div class="wrapper">
          <div class="banner__contents">
            <div class="banner__title">
              <h1>
                <span>믿을 수 있는</span>
                <span class="banner-bottom__title__span"
                  >판다마켓 중고 거래</span
                >
              </h1>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="wrapper footer-wrapper">
        <div class="footer__info">@codeit - 2024</div>
        <div id="footer__menu">
          <a href="privacy.html">Privacy Policy</a>
          <a href="faq.html">FAQ</a>
        </div>
        <div id="footer__media">
          <a
            href="https://www.facebook.com/"
            target="_blank"
            rel="noopener noreferrer"
            ><img src="images/social/ic_facebook.png" alt="페이스북" width="20"
          /></a>
          <a
            href="https://twitter.com/"
            target="_blank"
            rel="noopener noreferrer"
            ><img src="images/social/ic_twitter.png" alt="트위터" width="20"
          /></a>
          <a
            href="https://www.youtube.com/"
            target="_blank"
            rel="noopener noreferrer"
            ><img src="images/social/ic_youtube.png" alt="유튜브" width="20"
          /></a>
          <a
            href="https://www.instagram.com/"
            target="_blank"
            rel="noopener noreferrer"
            ><img
              src="images/social/ic_instagram.png"
              alt="인스타그램"
              width="20"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
