<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css"
    />
    <title>판다마켓</title>

    <meta name="description" content="일상의 모든 물건을 거래해보세요" />
    <!-- 페이스북, 카카오톡 -->
    <meta property="og:title" content="판다 마켓" />
    <meta property="og:description" content="일상의 모든 물건을 거래해보세요" />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://vocal-concha-a066c0.netlify.app/"
    />
    <meta
      property="og:image"
      content="https://vocal-concha-a066c0.netlify.app//images/img_preview.png"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="판다 마켓" />
    <meta
      name="twitter:description"
      content="일상의 모든 물건을 거래해보세요"
    />
    <meta
      property="og:image"
      content="https://vocal-concha-a066c0.netlify.app//images/img_preview.png"
    />
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body class="login_page">
    <main id="contents" class="contents">
      <div class="flex_center_box">
        <h1 class="logo large">
          <a href="/"><img src="images/logo.png" alt="판다마켓" /></a>
        </h1>

        <form action="">
          <div class="login_area_box">
            <div class="input_box">
              <label for="input_email" class="label">이메일</label>
              <input
                type="text"
                id="input_email"
                placeholder="이메일을 입력해주세요"
              />
              <span class="error_msg"></span>
            </div>
            <div class="input_box">
              <label for="input_pw" class="label">비밀번호</label>
              <div class="input btn_group">
                <input
                  type="password"
                  id="input_pw"
                  placeholder="비밀번호를 입력해주세요"
                />
                <div class="btn_pw_show">
                  <button type="button" class="btn btn_pw">
                    <span>비밀번호 보이기</span>
                  </button>
                </div>
              </div>
              <span class="error_msg"></span>
            </div>
            <button
              type="type"
              class="btn-blue large wide"
              id="buttonLogin"
              onClick="location.href='./item.html'"
              disabled
            >
              <span>로그인</span>
            </button>
            <div class="blue_box">
              <span>간편 로그인하기</span>
              <div class="social_group">
                <a
                  href="https://www.google.com/"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="social"
                >
                  <img src="images/ico_google.png" alt="구글 로그인" />
                </a>
                <a
                  href="https://www.kakaocorp.com/page/"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="social"
                >
                  <img src="images/ico_kakao.png" alt="카카오 로그인" />
                </a>
              </div>
            </div>
            <p class="guide_signup_text">
              판다마켓이 처음이신가요?
              <a href="./signup.html">회원가입</a>
            </p>
          </div>
        </form>
      </div>
    </main>

    <script>
      const inputs = document.querySelectorAll('input');
      const inputEmail = document.querySelector('#input_email');
      const inputPw = document.querySelector('#input_pw');
      const email_regex = /^[A-Za-z0-9_.\-]+@[A-Za-z0-9\-]+\.[A-Za-z0-9\-]+$/;

      inputs.forEach(function (input) {
        input.addEventListener('focusout', function () {
          inputValidate(input);
          toggleLoginButton();
        });
      });
      function inputValidate(input) {
        let msg = '';
        let inputId = input.getAttribute('id');
        if (input.value == '') {
          if (inputId == 'input_email') msg = '이메일을 입력해주세요.';
          else if (inputId == 'input_pw' || inputId == 'input_pw_check')
            msg = '비밀번호를 입력해주세요.';
        } else {
          if (inputId == 'input_email') {
            if (email_regex.test(inputEmail.value) == false)
              msg = '잘못된 이메일 형식입니다.';
          } else {
            msg = '';
          }

          if (inputId == 'input_pw') {
            const pw = inputPw.value;
            if (inputId === 'input_pw' && pw.length < 8) {
              msg = '비밀번호를 8자 이상 입력해주세요.';
            } else {
              msg = '';
            }
          }
        }

        setInputBlurMessage(input, msg);
      }
      function setInputBlurMessage(input, msg) {
        let inputBox = input.closest('.input_box');
        let errorMsg = inputBox.querySelector('.error_msg');
        inputBox.classList.remove('error');
        errorMsg.innerText = '';
        if (msg) {
          inputBox.classList.add('error');
          errorMsg.innerText = msg;
        }
      }

      function toggleLoginButton() {
        const buttonLogin = document.querySelector('#buttonLogin');
        const inputs = document.querySelectorAll('input');
        const errors = document.querySelectorAll('.error_msg');

        const emptyInputs = Array.from(inputs).filter(
          (input) => input.value.trim() === ''
        );

        const errorMessages = Array.from(errors).filter(
          (error) => error.innerText.trim() !== ''
        );

        if (emptyInputs.length === 0 && errorMessages.length === 0) {
          buttonLogin.removeAttribute('disabled');
        } else {
          buttonLogin.setAttribute('disabled', 'disabled');
        }
      }
      const toggleButtons = document.querySelectorAll('.btn_pw');

      toggleButtons.forEach(function (button) {
        button.addEventListener('click', function () {
          const inputWrapper = button.closest('.input');
          const input = inputWrapper.querySelector('input');
          const span = button.querySelector('span');

          if (input.value == '') return;
          if (input.type === 'password') {
            button.classList.add('show');
            input.type = 'text';
            span.innerText = '비밀번호 숨기기';
          } else {
            button.classList.remove('show');
            input.type = 'password';
            span.innerText = '비밀번호 보이기';
          }
        });
      });
    </script>
  </body>
</html>
