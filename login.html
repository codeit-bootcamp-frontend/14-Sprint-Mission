<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - 로그인</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/signup&loginpage/login.css" />
  </head>

  <body>
    <div class="loginpage">
      <a href="index.html">
        <img
          src="./images/logo/panda-market-logo.png"
          alt="panda-market-logo"
          id="mainlogo"
        />
      </a>
      <section class="loginsection">
        <div id="emailbox">
          <label class="loginlabel"> 이메일 </label>
          <input
            id="emailInput"
            class="logininput"
            alt="email"
            placeholder="이메일을 입력해주세요"
          />
          <div
            id="emailError"
            class="error-message"
            style="display: none"
          ></div>
        </div>
        <div id="passwardbox">
          <label class="loginlabel"> 비밀번호 </label>
          <div class="password-wrapper">
            <input
              placeholder="비밀번호를 입력해주세요"
              class="logininput"
              id="passwardinput"
              type="password"
              alt="passward"
            />
            <img
              src="./images/anyicons/passwardcancel.svg"
              alt="passwardtoggle"
              id="togglePassword"
            />
          </div>
          <div
            id="passwordError"
            class="error-message"
            style="display: none"
          ></div>
        </div>
        <button id="loginButton" class="button pill-button" disabled>
          로그인
        </button>
        <section class="socialloginsection">
          <div id="sociallogintext">간편 로그인하기</div>
          <div id="socialloginicon">
            <a href="https://www.google.co.kr/">
              <img src="./images/social/google-logo.png" alt="googleicon" />
            </a>
            <a href="https://www.kakaocorp.com/page/">
              <img src="./images/social/kakaotalk-logo.svg" alt="kakaoicon" />
            </a>
          </div>
        </section>
        <div id="gosignup">
          판다마켓은 처음이신가요?
          <a id="signuplink" href="signup.html">회원가입</a>
        </div>
      </section>
    </div>
    <script src="/javascript/login&signuppage/login.js"></script>
  </body>
</html>
