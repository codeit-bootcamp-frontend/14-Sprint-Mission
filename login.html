<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓 - login</title>
    <link rel="icon" href="images/logo/favicon.ico" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/global.css" />
    <link rel="stylesheet" href="/styles/auth.css" />
  </head>
  <body>
    <div class="auth-container">
      <!-- 판다마켓 로고 -->
      <div class="logo-wrapper">
        <a href="/index.html">
          <img
            src="/images/logo/pandaMarket-Logo.png"
            alt="판다마켓 logo"
            width="198"
          />
        </a>
      </div>

      <!-- 로그인 입력 폼 -->
      <form method="post" id="loginForm">
        <div class="input-form">
          <label for="email">이메일</label>
          <input
            id="email"
            type="email"
            name="email"
            placeholder="이메일을 입력해주세요"
          />
          <span id="email-value-empty" class="error-message"
            >이메일을 입력해주세요</span
          >
          <span id="email-value-invalid" class="error-message"
            >잘못된 이메일 형식입니다</span
          >
        </div>
        <div class="input-form">
          <label for="password">비밀번호</label>
          <div class="input-form-wrapper">
            <input
              id="password"
              type="password"
              name="password"
              placeholder="비밀번호를 입력해주세요"
            />
            <button
              type="button"
              class="password-toggle-button"
              aria-label="비밀번호 숨김"
            >
              <img
                src="/images/icon/auth/eye-invisible.svg"
                class="password-toggle-icon"
                alt="비밀번호 숨김 아이콘"
                width="24"
              />
            </button>
          </div>
          <span id="password-value-empty" class="error-message"
            >비밀번호를 입력해주세요</span
          >
          <span id="password-value-invalid" class="error-message"
            >비밀번호를 8자 이상 입력해주세요</span
          >
        </div>
        <button
          type="submit"
          class="button btn-round auth-button"
          id="Submit-Button"
        >
          로그인
        </button>
      </form>

      <!-- 간편 로그인 -->
      <div class="login-simple">
        <div class="login-simple-title">간편 로그인 하기</div>
        <div class="login-simple-social">
          <a href="https://www.google.com/">
            <img
              src="/images/icon/sns/google.png"
              alt="google login"
              width="42"
            />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img
              src="/images/icon/sns/kakao.png"
              alt="kakao login"
              width="42"
            />
          </a>
        </div>
      </div>

      <!-- 회원가입 페이지로 이동 -->
      <div class="switch-auth-wrapper">
        판다마켓이 처음이신가요?
        <a href="signup.html" class="switch-auth">회원가입</a>
      </div>
    </div>
    <script src="/scripts/auth.js"></script>
  </body>
</html>
