<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="styles/global.css" />
    <link rel="stylesheet" href="styles/auth.css" />
    <title>판다마켓</title>
  </head>
  <body>
    <main>
      <a href="/">
        <img src="/images/logo.png" alt="logo" class="main-logo" />
      </a>
      <form>
        <div class="form-input">
          <label for="email">이메일</label>
          <input
            id="email"
            name="email"
            placeholder="이메일을 입력해주세요"
            type="email"
          />
        </div>
        <div class="form-input">
          <label for="password">비밀번호</label>
          <div class="form-input-wrap">
            <input
              id="password"
              name="password"
              placeholder="비밀번호를 입력해주세요"
              type="password"
            />
            <img
              src="/images/password/hide.png"
              alt="비밀번호 가리기"
              class="hide"
            />
          </div>
        </div>
        <button>로그인</button>
      </form>
      <div class="sns-container">
        <div class="sns-container-text">간편 로그인하기</div>
        <div class="sns-container-list">
          <a href="https://www.google.com">
            <img src="/images/sns/google.png" alt="구글 로고" />
          </a>
          <a href="https://www.kakaocorp.com/page/">
            <img src="/images/sns/kakaotalk.png" alt="카카오톡 로고" />
          </a>
        </div>
      </div>
      <div class="form-move">
        판다마켓이 처음이신가요?
        <a href="signup.html">회원가입</a>
      </div>
    </main>
  </body>
</html>
