<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입</title>
    <!-- Pretendard 폰트 CDN -->
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
      rel="stylesheet"
    />

    <!-- 공통 스타일 -->
    <link rel="stylesheet" href="./assets/styles/variables.css" />
    <link rel="stylesheet" href="./assets/styles/reset.css" />
    <link rel="stylesheet" href="./assets/styles/signup.css" />
  </head>
  <body>
    <section class="signup-page">
      <div class="signup-container">
        <!-- 로고 -->
        <a href="/" class="signup-logo">
          <img src="./assets/images/panda_logo.svg" alt="판다마켓 로고" />
        </a>

        <!-- 회원가입 폼 -->
        <form class="signup-form">
          <div class="form-group">
            <label for="email" class="text-2lg-bold">이메일</label>
            <input type="email" id="email" class="text-lg-regular" />
          </div>
          <div class="form-group">
            <label for="nickname" class="text-2lg-bold">닉네임</label>
            <input type="nickname" id="nickname" class="text-lg-regular" />
          </div>
          <div class="form-group">
            <label for="password" class="text-2lg-bold">비밀번호</label>
            <div class="password-wrapper">
              <input type="password" id="password" class="text-lg-regular" />
              <button type="button" class="btn-toggle-password">
                <img
                  src="./assets/icons/visibility_off_btn.png"
                  alt="비밀번호 확인 아이콘"
                />
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="password-check" class="text-2lg-bold"
              >비밀번호 확인</label
            >
            <div class="password-check-wrapper">
              <input
                type="password"
                id="password-check"
                class="text-lg-regular"
              />
              <button type="button" class="btn-toggle-password">
                <img
                  src="./assets/icons/visibility_on_btn.png"
                  alt="비밀번호 확인 아이콘"
                />
              </button>
            </div>
          </div>
          <button type="submit" class="btn-signup text-xl-semibold">
            회원가입
          </button>
        </form>

        <!-- 간편 로그인 -->
        <div class="easy-login">
          <span class="text-lg-medium">간편 로그인하기</span>
          <div class="sns-buttons">
            <button
              class="btn-sns google"
              onclick="location.href='https://www.google.com/'"
            >
              <img src="./assets/icons/ic_google.png" alt="구글 로그인" />
            </button>
            <button
              class="btn-sns kakao"
              onclick="location.href='https://www.kakaocorp.com/page/'"
            >
              <img src="./assets/icons/ic_kakao.png" alt="카카오 로그인" />
            </button>
          </div>
        </div>

        <!-- 로그인 안내 -->
        <p class="login-guide">
          이미 회원이신가요?
          <a href="./login.html">로그인</a>
        </p>
      </div>
    </section>
  </body>
</html>
