<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>

    <!-- Pretendard 폰트 CDN -->
    <link
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
      rel="stylesheet"
    />

    <!-- 공통 스타일 -->
    <link rel="stylesheet" href="./assets/styles/variables.css" />
    <link rel="stylesheet" href="./assets/styles/reset.css" />
    <link rel="stylesheet" href="./assets/styles/main.css" />
  </head>
  <body>
    <!-- 헤더 -->
    <header class="header">
      <div class="header-inner">
        <a href="/panda-market/" class="logo">
          <img src="./assets/images/panda_logo.svg" alt="판다마켓 로고" />
        </a>
        <a href="login.html" class="login-btn">로그인</a>
      </div>
    </header>

    <!-- 메인 배너 -->
    <section class="main-banner">
      <div class="main-banner-wrapper">
        <div class="main-banner-left">
          <p class="main-banner-text">
            일상의 모든 물건을<br />거래해 보세요
          </p>
          <a href="items.html" class="browse-btn text-xl-semibold">
            구경하러 가기
          </a>
        </div>
        <div class="main-banner-image">
          <img src="./assets/images/Img_home_top.svg" alt="메인 배너 이미지" />
        </div>
    </section>

    <!-- 인기 상품 세션 -->
    <section class="info-card-section">
      <div class="info-card">
        <div class="info-card-image">
          <img src="./assets/images/Img_home_01.svg" alt="인기 상품 이미지" />
        </div>
        <div class="info-card-text">
          <p class="info-card-label text-2lg-bold">Hot item</p>
          <h2 class="info-card-title">인기 상품을<br />확인해 보세요</h2>
          <p class="info-card-description text-2xl-medium">
            가장 HOT한 중고거래 물품을<br />판다마켓에서 확인해 보세요.
          </p>
        </div>
      </div>
    </section>

    <!-- 상품 검색 세션 -->
    <section class="info-card-section">
      <div class="info-card reverse">
        <div class="info-card-image">
          <img src="./assets/images/Img_home_02.svg" alt="상품 검색 이미지" />
        </div>
        <div class="info-card-text">
          <p class="info-card-label text-2lg-bold">Search</p>
          <h2 class="info-card-title">구매를 원하는<br />상품을 검색하세요</h2>
          <p class="info-card-description text-2xl-medium">
            구매하고 싶은 물품은 검색해서<br />쉽게 찾아보세요
          </p>
        </div>
      </div>
    </section>

    <!-- 상품 등록 페이지 -->
    <section class="info-card-section">
      <div class="info-card">
        <div class="info-card-image">
          <img src="./assets/images/Img_home_03.svg" alt="상품 등록 이미지" />
        </div>
        <div class="info-card-text">
          <p class="info-card-label text-2lg-bold">Register</p>
          <h2 class="info-card-title">판매를 원하는<br />상품을 등록하세요</h2>
          <p class="info-card-description text-2xl-medium">
            어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
          </p>
        </div>
      </div>
    </section>

    <!-- 마지막 배너 -->
    <section class="sub-banner">
      <div class="sub-banner-wrapper">
        <div class="sub-banner-left">
          <p class="sub-banner-text">
            믿을 수 있는<br />판다마켓 중고 거래
          </p>
        </div>
        <div class="sub-banner-image">
          <img src="./assets/images/Img_home_bottom.svg" alt="서브 배너 이미지" />
        </div>
      </div>      
    </section>
  </body>

  <!-- 푸터 -->
  <footer class="footer">
    <div class="footer-inner">
      <p class="copyright">©codeit - 2024</p>

      <!-- 가운데 - 페이지 연결 -->
      <nav class="footer-links">
        <a href="privacy.html">Privacy Policy</a>
        <a href="faq.html">FAQ</a>
      </nav>

      <!-- 오른쪽 SNS 아이콘 -->
      <div class="footer-sns-links">
        <a href="https://www.facebook.com" target="_blank">
          <img src="./assets/icons/ic_facebook.svg" alt="Facebook" />
        </a>
        <a href="https://x.com/?lang=ko" target="_blank">
          <img src="./assets/icons/ic_twitter.svg" alt="Twitter" />
        </a>     
        <a
          href="https://www.youtube.com/?hl=ko&gl=KR&app=desktop"
          target="_blank"
        >
          <img src="./assets/icons/ic_youtube.svg" alt="Youtube" />
        </a>
        <a href="https://www.instagram.com/" target="_blank">
          <img src="./assets/icons/ic_instagram.svg" alt="Instagram" />
        </a>
      </div>
    </div>
  </footer>
</html>
